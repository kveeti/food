[package]
name = "version3"
version = "0.1.0"
edition = "2024"

[features]
import-tools = []

[[bin]]
name = "import-foods"
path = "src/bin/import_foods.rs"
required-features = ["import-tools"]

[dependencies]
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
topcoat = { version = "0.5.0", default-features = false, features = ["asset", "cookie", "font", "htmx", "multipart", "router", "serve", "session", "tailwind", "view"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "derive"] }
base64 = "0.22"
chrono = "0.4"
csv = "1.3"
encoding_rs = "0.8"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
futures-util = "0.3"
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
rsa = { version = "0.9.8", default-features = false, features = ["getrandom", "sha2", "std", "u64_digit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v7"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[build-dependencies]
topcoat = { version = "0.5.0", default-features = false, features = ["tailwind"] }

[profile.dev]
debug = true

[profile.dev.package."*"]
debug = false

[profile.test]
debug = 1

[profile.test.package."*"]
debug = false
