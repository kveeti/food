[package]
name = "food"
version = "0.1.0"
edition = "2024"

[features]
import-tools = ["dep:csv", "dep:encoding_rs", "dep:flate2"]

[[bin]]
name = "import-foods"
path = "src/bin/import_foods/main.rs"
required-features = ["import-tools"]

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
csv = { version = "1.3", optional = true }
encoding_rs = { version = "0.8", optional = true }
flate2 = { version = "1", default-features = false, features = ["zlib"], optional = true }
jsonwebtoken = { version = "9.3", default-features = false }
language-tags = "0.3"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-semantic-conventions = "0.32"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "derive", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls", "uuid"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
topcoat = { version = "0.6.2", default-features = false, features = ["asset", "cookie", "htmx", "router", "serve", "tailwind", "view"] }
tracing = { version = "0.1", features = ["attributes"] }
tracing-forest = "0.3"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v7"] }

[build-dependencies]
topcoat = { version = "0.6.2", default-features = false, features = ["tailwind"] }

[profile.dev]
debug = true

[profile.dev.package."*"]
debug = false
