[package]
name = "back"
version = "0.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.3", features = ["macros"] }
aes-gcm = "0.10.3"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
hkdf = "0.12.4"
p256 = { version = "0.13.2", features = ["ecdh", "ecdsa"] }
rand = "0.8.5"
reqwest = { version = "0.12.24", default-features = false, features = ["http2", "rustls-tls-webpki-roots"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "json", "macros", "migrate"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "fs", "trace"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[profile.release]
strip = "debuginfo"
lto = true
opt-level = "z"
codegen-units = 1

[profile.dev]
split-debuginfo = "unpacked"
